global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'api-gateway-metrics'
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:3000']

  - job_name: 'booking-service-metrics'
    metrics_path: /metrics
    static_configs:
      - targets: ['booking-service:3005']

  - job_name: 'user-service-metrics'
    metrics_path: /metrics
    static_configs:
      - targets: ['user-service:3006']

  - job_name: 'movie-service-metrics'
    metrics_path: /metrics
    static_configs:
      - targets: ['movie-service:3007']

  - job_name: 'cinema-service-metrics'
    metrics_path: /metrics
    static_configs:
      - targets: ['cinema-service:3008']
